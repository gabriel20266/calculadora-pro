<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Pro | Precisão e Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        /* Container Persuasivo */
        .calculator-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: #60a5fa;
        }

        /* Display de Resultados */
        .display {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #previous-op {
            font-size: 0.875rem;
            color: #94a3b8;
            height: 1.2rem;
            margin-bottom: 4px;
        }

        #current-op {
            font-size: 2rem;
            font-weight: 600;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Grade de Botões */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            padding: 1.25rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .operator {
            color: #60a5fa;
            background: rgba(37, 99, 235, 0.1);
        }

        .equals {
            background: var(--primary);
            grid-column: span 2;
            font-weight: 700;
        }

        .equals:hover {
            background: #3b82f6;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .clear {
            color: #f87171;
        }

        /* Rodapé de Confiança */
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <div class="header">
            <h1>CALCULADORA PRO</h1>
        </div>

        <div class="display">
            <div id="previous-op"></div>
            <div id="current-op">0</div>
        </div>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>
            <button class="operator" onclick="appendOperator('*')">×</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('-')">-</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('+')">+</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendNumber('.')">.</button>
            
            <button onclick="appendNumber('0')">0</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

        
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;

        const currentOpElement = document.getElementById('current-op');
        const previousOpElement = document.getElementById('previous-op');

        function updateDisplay() {
            currentOpElement.innerText = currentInput;
            previousOpElement.innerText = previousInput + (operator || '');
        }

        function appendNumber(number) {
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                if (number === '.' && currentInput.includes('.')) return;
                currentInput += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null) calculate();
            previousInput = currentInput;
            operator = op;
            currentInput = '0';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === '') currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    result = current === 0 ? 'Erro' : prev / current; 
                    break;
                default: return;
            }

            currentInput = result.toString();
            operator = null;
            previousInput = '';
            updateDisplay();
        }
    </script>
</body>
</html>
